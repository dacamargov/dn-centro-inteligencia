# =============================================================================
# dichter & neira · Centro de Inteligencia — Databricks Asset Bundle
# =============================================================================
# Este archivo es el único inventario de la demo. Todo lo que se crea en el
# workspace —esquema, tablas, jobs, app— está declarado en `resources/`, un
# archivo por dominio.
#
# Instalación completa:   ./instalar.sh
# Ver qué se va a crear:  databricks bundle validate
# Desinstalar todo:       ./desinstalar.sh
#
# `instalar.sh` es un envoltorio delgado sobre `databricks bundle deploy`. Hace
# tres cosas que un bundle no puede hacer solo: descubrir el warehouse, crear el
# dashboard AI/BI (que necesita el id antes de configurar el app) y otorgarle
# permisos al service principal del app, que no existe hasta que el app existe.
# =============================================================================

bundle:
  name: dn-centro-inteligencia

include:
  - resources/*.yml

# -----------------------------------------------------------------------------
# Variables — todo lo ajustable de la demo, en un solo lugar.
# Se sobreescriben por target, por línea de comandos (`--var clave=valor`) o por
# entorno (`BUNDLE_VAR_clave=valor`).
# -----------------------------------------------------------------------------
variables:
  catalog:
    description: Catálogo de Unity Catalog donde vive la demo. Necesitas CREATE SCHEMA sobre él.
    default: main

  schema:
    description: Esquema dentro del catálogo. Todas las tablas de la demo viven acá.
    default: ditcher_neira

  warehouse_id:
    description: >-
      SQL Warehouse serverless que consulta el app. `instalar.sh` lo descubre solo
      si no se pasa; para fijarlo, `--var warehouse_id=<id>`.
    default: ""

  cliente:
    description: >-
      Fabricante que contrata el estudio. Todas las métricas de "nuestro"
      desempeño se filtran por él y el resto del catálogo es competencia.
    default: Nestlé

  job_prefix:
    description: >-
      Prefijo de los jobs. El botón "Iniciar demo" del app los localiza por acá,
      así que tiene que coincidir con la variable de entorno JOB_PREFIX del app.
    default: DNCentro

  app_name:
    description: Nombre del Databricks App. Debe ser único en el workspace.
    default: dn-centro-inteligencia

  llm_endpoint:
    description: >-
      Foundation Model que usan los agentes. Vacío = los agentes caen a sus
      plantillas deterministas, sin costo de inferencia.
    default: databricks-meta-llama-3-3-70b-instruct

  dashboard_id:
    description: >-
      Dashboard AI/BI que embebe el app. Lo llena `instalar.sh` después de
      crearlo. Sin valor = la pestaña del dashboard queda oculta.
    # Un espacio, no vacío: ver la nota sobre variables opcionales más abajo.
    default: " "

  genie_space_id:
    description: >-
      Sala de Genie. La crea `instalar.sh` y pasa el id acá. Sin valor = el app
      usa el modo demostración con preguntas y respuestas precargadas.
    default: " "

  genie_title:
    description: >-
      Título de la sala de Genie. Es también la clave con la que `instalar.sh` la
      reconoce entre corridas, así que cambiarlo crea una sala nueva.
    default: "dichter & neira · Centro de Inteligencia"

  # Las variables opcionales llevan un espacio como default, no una cadena
  # vacía. La API de Databricks Apps rechaza una variable de entorno sin `value`,
  # y el CLI omite el campo cuando la cadena está vacía; el app, por su lado,
  # hace .strip() y trata el espacio como ausente. Sin esto el deploy del app
  # falla con "Must specify environment variable source".

  # --- Lakebase (copiloto de campo) ------------------------------------------
  # Parte de la instalación estándar. La instancia la crea `instalar.sh` y su
  # host se resuelve en cada corrida, así que `lakebase_host` no se escribe a
  # mano. Ver docs/LAKEBASE.md — incluye la nota de costo.
  lakebase_instance:
    description: >-
      Instancia de Lakebase (Postgres gestionado) que sirve el copiloto de campo.
      `instalar.sh` la crea si no existe y la adjunta al app como recurso, que es
      lo que hace que Databricks le cree al service principal su rol de Postgres.
    default: dn-centro-lakebase

  lakebase_db:
    description: >-
      Base de datos dentro de la instancia. `databricks_postgres` es la que viene
      creada de fábrica; usarla evita un CREATE DATABASE en la instalación.
    default: databricks_postgres

  lakebase_capacity:
    description: >-
      Tamaño de la instancia. CU_1 es el más chico y le sobra a la demo: el
      copiloto sirve lecturas por clave sobre 140 filas.
    default: CU_1

  lakebase_host:
    description: >-
      Host de la instancia. No se configura a mano: `instalar.sh` lo resuelve de
      la instancia y lo pasa con `--var` en cada corrida.
    default: " "

# -----------------------------------------------------------------------------
# Qué se sube al workspace. Lo que no sirve en runtime se queda afuera: el
# frontend se despliega compilado (`frontend/dist`), así que sus fuentes y sus
# dependencias no tienen para qué viajar.
# -----------------------------------------------------------------------------
sync:
  exclude:
    - "**/node_modules"
    - "**/.venv"
    - "**/__pycache__"
    - "**/*.tsbuildinfo"
    - "**/.DS_Store"
    - "src/app/frontend/src"
    - "src/app/frontend/public"

targets:
  # El target normal: una instalación por usuario, aislada bajo su carpeta.
  demo:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  # Target desechable para probar el instalador sin tocar la instalación real.
  # Todo cambia de nombre, así que puede convivir con `demo` en el mismo
  # workspace y `databricks bundle destroy -t pruebas` lo borra completo.
  pruebas:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: dn_pruebas
      app_name: dn-pruebas
      job_prefix: DNPruebas
      lakebase_instance: dn-pruebas-lakebase
      genie_title: "dichter & neira · Centro de Inteligencia (pruebas)"
